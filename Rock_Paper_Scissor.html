<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor Game.</title>
      <link rel="stylesheet" href="Rock_Paper_Scissor.css">
      <script src="Rock_Paper_Scissor.js" defer></script>
</head>
<body>
    <h1> Rock Paper Scissors</h1>
    <div class="choice">
        <div class="choices" id="Rock">
            <div id="rock">
                <img src="Images/rock.png"/>
            </div>
        </div>

          <div class="choices" id="Paper">
            <div id="paper">
                <img src="Images/paper.png"/>
            </div>
        </div>

         <div class="choices" id="Scissor">
            <div id="scissor">
                <img src="Images/scissors.png"/>
            </div>
        </div>

    </div>

    <div class="score">
        <div id="user-score">
            <h2>You</h2>
            <p>0</p>
        </div>

        <div id="computer-score">
            <h2>Com</h>
            <p>0</p>
        </div>

    </div>

    <div class="result-message" id="message">
        <p>Play your Move.</p>
    </div>

    <div class="play-Agin-Container">
        <button id="play-agin-btn">Play Again</button>
    </div>
    
</body>
</html>
